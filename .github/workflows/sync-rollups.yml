name: Sync acquisition rollups

on:
  push:
    paths:
      - "data/people.csv"
      - "data/organization-corrections.csv"
      - "scripts/sync_rollups.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply corrections and person rollups
        run: python scripts/sync_rollups.py --write
      - name: Validate synchronized data
        run: python scripts/validate_data.py
      - name: Commit generated rollups
        run: |
          if git diff --quiet -- data/organizations.csv data/metadata.json; then
            echo "No rollup changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/organizations.csv data/metadata.json
          git commit -m "Sync acquisition rollups"
          git push

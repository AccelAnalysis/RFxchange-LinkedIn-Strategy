name: Migrate stable organization IDs

on:
  push:
    paths:
      - "scripts/migrate_org_ids.py"
      - ".github/workflows/migrate-org-ids.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assign stable organization IDs
        run: python scripts/migrate_org_ids.py --write
      - name: Apply correction and people rollups
        run: python scripts/sync_rollups.py --write
      - name: Validate migrated data
        run: python scripts/validate_data.py
      - name: Commit migration
        run: |
          if git diff --quiet -- data/organizations.csv data/people.csv data/organization-corrections.csv data/metadata.json; then
            echo "No migration changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/organizations.csv data/people.csv data/organization-corrections.csv data/metadata.json
          git commit -m "Migrate to stable organization IDs"
          git push

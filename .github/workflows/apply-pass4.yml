name: Apply fourth verified prospect pass

on:
  push:
    paths:
      - "scripts/apply_pass4.py"
      - ".github/workflows/apply-pass4.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Append fourth-pass people
        run: python scripts/apply_pass4.py
      - name: Validate data
        run: python scripts/validate_data.py
      - name: Commit fourth pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/people.csv
          if git diff --cached --quiet; then
            echo "No fourth-pass changes to commit."
          else
            git commit -m "Add fourth verified LinkedIn prospect pass"
            git push
          fi
